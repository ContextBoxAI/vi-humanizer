<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vi-humanizer</title>
  <meta name="description" content="Viết lại văn bản AI cho tự nhiên như người Việt viết. Chạy hoàn toàn trên máy của bạn.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1b1b'/%3E%3Cpath d='M6 17h5l3-7 4 12 3-5h5' fill='none' stroke='%23ff6b00' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try { const th = localStorage.getItem("vh.theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
  </script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M6 17h5l3-7 4 12 3-5h5"/></svg>
      <span class="name">vi-humanizer</span>
      <span class="tag mono">E2B · <span data-i18n="local"></span></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="rewrite" aria-selected="true" data-i18n="tabRewrite"></button>
      <button role="tab" data-tab="chat" aria-selected="false" data-i18n="tabChat"></button>
    </nav>
    <div class="tools">
      <span class="status mono" id="status"><i></i><span></span></span>
      <button class="icon" id="theme" data-i18n-title="theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <div class="seg mono" id="lang" data-i18n-title="lang"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
      <button class="icon" id="open-settings" data-i18n-title="settings"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
    </div>
  </header>

  <main>
    <section id="view-rewrite" class="view">
      <div class="tones" id="tones" role="radiogroup"></div>
      <div class="split">
        <article class="panel" id="draft-panel">
          <header class="ph">
            <span class="mono idx">01</span><b data-i18n="draft"></b><span class="sub" data-i18n="draftSub"></span>
            <span class="mono count" id="draft-count"></span>
          </header>
          <div class="body">
            <textarea id="draft" spellcheck="false" data-i18n-placeholder="draftPlaceholder"></textarea>
            <div class="text diff" id="draft-diff" hidden></div>
          </div>
          <footer class="pf">
            <button class="ghost" id="paste"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/></svg><span data-i18n="paste"></span></button>
            <button class="ghost" id="clear"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span data-i18n="clear"></span></button>
            <button class="ghost" id="sample" data-i18n="sample"></button>
            <button class="ghost" id="edit" hidden data-i18n="edit"></button>
            <span class="legend mono" id="legend-cut" hidden><s></s><span data-i18n="cut"></span></span>
          </footer>
        </article>

        <div class="mid">
          <button class="go" id="go" data-i18n-title="go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          <span class="mono go-label" id="go-label" data-i18n="go"></span>
          <kbd class="mono">⌘↵</kbd>
        </div>

        <article class="panel" id="rewrite-panel">
          <header class="ph">
            <span class="mono idx">02</span><b data-i18n="rewrite"></b><span class="sub" data-i18n="rewriteSub"></span>
            <span class="mono count" id="rewrite-count"></span>
            <label class="toggle"><input type="checkbox" id="show-changes" checked><span data-i18n="showChanges"></span></label>
          </header>
          <div class="body">
            <div class="text" id="rewrite" aria-live="polite"><p class="empty" data-i18n="rewriteEmpty"></p></div>
          </div>
          <footer class="pf">
            <span class="badge mono" id="numbers" hidden></span>
            <span class="mono stats" id="stats"></span>
            <span class="grow"></span>
            <button class="ghost" id="regen" disabled><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span data-i18n="regenerate"></span></button>
            <button class="solid" id="copy" disabled><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span data-i18n="copy"></span></button>
          </footer>
        </article>
      </div>
    </section>

    <section id="view-chat" class="view" hidden>
      <div class="chat panel">
        <div class="msgs" id="msgs" aria-live="polite">
          <div class="chat-empty" id="chat-empty">
            <p data-i18n="chatEmpty"></p>
            <span class="mono sub" data-i18n="tryAsking"></span>
            <div class="examples" id="examples"></div>
          </div>
        </div>
        <form class="composer" id="composer">
          <textarea id="ask" rows="1" data-i18n-placeholder="chatPlaceholder"></textarea>
          <div class="composer-row">
            <button type="button" class="ghost" id="new-chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="newChat"></span></button>
            <span class="grow"></span>
            <button type="submit" class="solid accent" id="send"><span data-i18n="send"></span></button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2 data-i18n="settings"></h2>
      <label><span data-i18n="api"></span><input id="set-api" class="mono" placeholder="/v1"><small data-i18n="apiHint"></small></label>
      <label><span data-i18n="model"></span><input id="set-model" class="mono" placeholder="vi-humanizer"></label>
      <label><span><span data-i18n="temperature"></span> <output class="mono" id="set-temp-out"></output></span><input id="set-temp" type="range" min="0.2" max="1.2" step="0.05"></label>
      <label><span data-i18n="system"></span><textarea id="set-system" rows="3" data-i18n-placeholder="systemPlaceholder"></textarea></label>
      <div class="row"><button value="cancel" class="ghost" data-i18n="close"></button><button value="save" class="solid accent" id="save-settings" data-i18n="save"></button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
